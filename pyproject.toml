[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markowizard"
version = "0.1.0"
description = "Markowitz portfolio optimization and analysis library"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "GusFurtado", email = "gustavofurtado2@gmail.com"},
]
requires-python = ">=3.10"
keywords = ["portfolio", "finance", "optimization", "markowitz", "efficient-frontier"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.4",
    "scipy>=1.8",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.1.63",
]
viz = [
    "plotly>=5.10",
]
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[project.urls]
Homepage = "https://github.com/OutliersAnalytics/MarkoWizard"
Repository = "https://github.com/OutliersAnalytics/MarkoWizard"
Documentation = "https://github.com/OutliersAnalytics/MarkoWizard#readme"

[project.scripts]
markowizard-web = "backend.main:run"

[tool.setuptools.packages.find]
include = ["markowizard*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001"]

[tool.coverage.run]
source = ["markowizard"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
]